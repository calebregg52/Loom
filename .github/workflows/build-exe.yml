name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
      - run: pyinstaller loom.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: Loom-windows
          path: dist/Loom.exe
